# Default Starter printer.cfg
# Include standard macros (Pause, Resume, Cancel, Start/End Print)
[include macros.cfg]

[mcu]
# Replace with your printer's persistent serial id:
# e.g. /dev/serial/by-id/usb-Klipper_stm32f446xx_...
serial: /dev/ttyUSB0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# Virtual SD card and display status required for Moonraker and Mainsail
[virtual_sdcard]
path: /home/klippy/printer_data/gcodes

[display_status]

[pause_resume]

