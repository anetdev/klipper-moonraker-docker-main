# Moonraker Telegram Bot configuration
# Refer to: https://github.com/nlef/moonraker-telegram-bot/wiki

[bot]
server: moonraker:7125
bot_token: YOUR_TELEGRAM_BOT_TOKEN
chat_id: YOUR_TELEGRAM_CHAT_ID

[camera]
host: http://ustreamer:8080/?action=stream

[progress_notification]
percent: 5
height: 5
time: 60

[timelapse]
cleanup: true
height: 0.2
time: 5
target_fps: 30

