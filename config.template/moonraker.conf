[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/klippy/printer_data/comms/klippy.sock

[file_manager]
enable_object_processing: True

[data_store]
temperature_store_size: 600
gcode_store_size: 1000

[authorization]
