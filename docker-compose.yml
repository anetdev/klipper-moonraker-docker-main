services:
  klipper:
    build:
      context: ./services/klipper
      dockerfile: Dockerfile
    image: klipper-service:latest
    container_name: klipper-v2
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    group_add:
      - ${DIALOUT_GID:-dialout}
      - tty
    devices:
      - ${PRINTER_DEVICE:-/dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0}:/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
      - ${PRINTER_DEVICE:-/dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0}:/dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
      - ${PRINTER_DEVICE:-/dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0}:/dev/ttyUSB0
    volumes:
      - ./printer_data:/home/klippy/printer_data
      - ./config.template:/etc/klipper/template:ro
    healthcheck:
      test: ["CMD", "test", "-S", "/home/klippy/printer_data/comms/klippy.sock"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s
    networks:
      - klipper-net

  moonraker:
    build:
      context: ./services/moonraker
      dockerfile: Dockerfile
    image: moonraker-service:latest
    container_name: moonraker-v2
    restart: unless-stopped
    ports:
      - "${MOONRAKER_PORT:-7125}:7125"
    volumes:
      - ./printer_data:/home/klippy/printer_data
      - ./config.template:/etc/moonraker/template:ro
    depends_on:
      klipper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7125/server/info"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - klipper-net

  ustreamer:
    build:
      context: ./services/ustreamer
      dockerfile: Dockerfile
    image: ustreamer-service:latest
    container_name: ustreamer
    restart: unless-stopped
    ports:
      - "${WEBCAM_PORT:-8080}:8080"
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:/dev/video0
    group_add:
      - video
    environment:
      DEVICE: /dev/video0
      RESOLUTION: ${WEBCAM_RESOLUTION:-1280x720}
      FRAMERATE: ${WEBCAM_FPS:-30}
      FORMAT: ${WEBCAM_FORMAT:-MJPEG}
    profiles:
      - all
      - webcam
    networks:
      - klipper-net

  telegram-bot:
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
    image: telegram-bot-service:latest
    container_name: telegram-bot
    restart: unless-stopped
    volumes:
      - ./printer_data:/home/klippy/printer_data
      - ./config.template:/etc/telegram/template:ro
    depends_on:
      moonraker:
        condition: service_healthy
    profiles:
      - all
      - bots
    networks:
      - klipper-net

networks:
  klipper-net:
    driver: bridge
